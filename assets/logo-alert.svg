<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- HusqA Cockpit alert icon (tray, when a mower needs attention): robotic lawn mower seen from above, on a striped lawn. -->
  <defs>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="52"/>
    </clipPath>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cb84f"/>
      <stop offset="1" stop-color="#2f7d32"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b8187"/>
      <stop offset="1" stop-color="#43484d"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e949a"/>
      <stop offset="1" stop-color="#5a5f64"/>
    </linearGradient>
    <linearGradient id="hatch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f44"/>
      <stop offset="0.55" stop-color="#1b1e21"/>
      <stop offset="1" stop-color="#111315"/>
    </linearGradient>
    <linearGradient id="stop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e2561a"/>
    </linearGradient>
  </defs>

  <!-- Lawn tile with mowing stripes -->
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="256" height="256" fill="url(#lawn)"/>
    <g fill="#ffffff" opacity="0.10">
      <rect x="8" y="0" width="40" height="256"/>
      <rect x="88" y="0" width="40" height="256"/>
      <rect x="168" y="0" width="40" height="256"/>
    </g>
    <!-- Soft drop shadow under the mower -->
    <path fill="#000000" opacity="0.22" d="M134 42 C186 42 208 62 212 98 L222 172 C226 210 206 230 172 232 L96 232 C62 230 42 210 46 172 L56 98 C60 62 82 42 134 42 Z"/>
  </g>

  <!-- Rear drive wheels -->
  <g fill="#1d2023">
    <rect x="28" y="136" width="28" height="66" rx="10"/>
    <rect x="200" y="136" width="28" height="66" rx="10"/>
  </g>
  <g fill="#d9dcdf" opacity="0.55">
    <rect x="34" y="145" width="4" height="48" rx="2"/>
    <rect x="218" y="145" width="4" height="48" rx="2"/>
  </g>

  <!-- Outer shell (front points up) -->
  <path fill="url(#shell)" d="M128 36
    C180 36 202 54 206 90
    L214 166
    C218 202 200 218 168 220
    L88 220
    C56 218 38 202 42 166
    L50 90
    C54 54 76 36 128 36 Z"/>

  <!-- Upper body panel -->
  <path fill="url(#top)" d="M128 48
    C172 48 190 62 193 92
    L199 160
    C202 192 188 206 162 207
    L94 207
    C68 206 54 192 57 160
    L63 92
    C66 62 84 48 128 48 Z"/>

  <!-- Front bumper / sensor nose -->
  <path fill="#2b2f33" d="M100 46 C110 39 146 39 156 46 L151 60 C142 56 114 56 105 60 Z"/>

  <!-- Side vents -->
  <g fill="none" stroke="#3f4347" stroke-width="5" stroke-linecap="round">
    <path d="M76 100 L72 150"/>
    <path d="M180 100 L184 150"/>
  </g>

  <!-- Display hatch frame and lid -->
  <rect x="86" y="80" width="84" height="120" rx="24" fill="#2a2e32"/>
  <rect x="92" y="86" width="72" height="80" rx="19" fill="url(#hatch)"/>
  <!-- Glossy reflection on the lid -->
  <path fill="#ffffff" opacity="0.16" d="M100 98 C100 91 105 90 111 90 L140 90 C129 106 116 124 100 148 Z"/>

  <!-- Orange STOP button -->
  <rect x="96" y="170" width="64" height="24" rx="9" fill="url(#stop)"/>
  <rect x="103" y="173" width="50" height="5" rx="2.5" fill="#ffffff" opacity="0.30"/>
  <!-- Alert badge -->
  <circle cx="200" cy="56" r="46" fill="#d32f2f" stroke="#ffffff" stroke-width="8"/>
  <rect x="193" y="28" width="14" height="38" rx="7" fill="#ffffff"/>
  <circle cx="200" cy="82" r="8" fill="#ffffff"/>
</svg>
