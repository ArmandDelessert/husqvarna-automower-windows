<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- No inline script or style (see map.js, map.css). data: is the blank image Leaflet puts in discarded tiles. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="leaflet.css" />
  <link rel="stylesheet" href="map.css" />
</head>
<body>
  <div id="map"></div>
  <script src="leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
